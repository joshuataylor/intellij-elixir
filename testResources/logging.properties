# Gradle's test worker re-reads the JDK's java.util.logging configuration when tests start, which puts an INFO
# ConsoleHandler on the root logger. The platform logs INFO from its shutdown hooks after the last test, when
# nothing captures stderr, so each fork printed its index and VFS disposal into the build log.
handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=WARNING
