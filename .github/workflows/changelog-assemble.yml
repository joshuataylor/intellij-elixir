name: Assemble changelog

# Folds the merged pull request's changelog.d fragments into CHANGELOG.md's [Unreleased] section and
# deletes them, so the committed file stays complete and linkable - the truncated change notes in the
# plugin descriptor link to it - while pull requests themselves never touch it and so never conflict.
on:
  push:
    branches: [ main ]
    paths: [ 'changelog.d/**' ]

# One at a time: two merges assembling at once would race on the same push. Never cancel in progress -
# a cancelled run leaves its fragments unassembled and its entry silently missing.
concurrency:
  group: assemble-changelog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assemble:
    name: Assemble changelog
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The assembler commits, so this checkout keeps its credentials.
          persist-credentials: true

      # The pull request this push came from, for the entry's link and author. A push with no
      # associated pull request - a direct commit - leaves both empty and the job stops.
      - name: Identify the merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: node .github/scripts/merged-pull-request.js

      - name: Assemble
        if: ${{ steps.pr.outputs.number != '' && steps.pr.outputs.fragments != '' }}
        env:
          FRAGMENTS: ${{ steps.pr.outputs.fragments }}
        run: |
          args=""
          for f in $FRAGMENTS; do args="$args --file $f"; done
          # shellcheck disable=SC2086
          node .github/scripts/assemble-changelog.js --pr "${{ steps.pr.outputs.number }}" --author "${{ steps.pr.outputs.author }}" $args

      - name: Commit
        if: ${{ steps.pr.outputs.number != '' && steps.pr.outputs.fragments != '' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md changelog.d
          git commit -m "docs(changelog): assemble the entry for #${PR}"
          git push
